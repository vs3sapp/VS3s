<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<title>VS3s - Maud True Born VS3s' King Will Always Reign in Goodwill</title>
<style>
body{margin:0;background:#000052;color:#fff;font-family:Inter,sans-serif}
#vs3s-header{display:flex;justify-content:space-between;align-items:center;background:#000052;padding:10px 12px;border-bottom:2px solid #C9A86A}
.left-flags{display:flex;gap:10px;align-items:center}
.stacked{display:flex;flex-direction:column;gap:6px}
.stacked img{width:42px;height:28px;object-fit:cover;border:1px solid #fff;border-radius:3px}
#flag-dest{width:74px;height:62px;object-fit:cover;border:2px solid #C9A86A;border-radius:4px;box-shadow:0 0 10px rgba(201,168,106,.4)}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-circle{width:44px;height:44px;background:radial-gradient(circle,#C9A86A,#000052);border:2px solid #C9A86A;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.ticker{background:#000033;color:#C9A86A;white-space:nowrap;overflow:hidden;padding:6px;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>

<!-- HEADER ROW - YOUR 3 FLAGS + LOGO -->
<div id="vs3s-header">
  <div class="left-flags">
    <div class="stacked">
      <div><img id="flag-origin" src="https://flagcdn.com/w80/za.png"><div style="font-size:8px;color:#C9A86A;">ORIGIN - Ethnic Nationality</div></div>
      <div><img id="flag-citizen" src="https://flagcdn.com/w80/za.png"><div style="font-size:8px;color:#C9A86A;">CITIZENSHIP</div></div>
    </div>
    <div style="margin-left:8px;text-align:center;">
      <img id="flag-dest" src="https://flagcdn.com/w80/us.png">
      <div style="font-size:8px;color:#C9A86A;margin-top:2px;">DESTINATION - Where User Is</div>
    </div>
  </div>
  <div class="logo-area">
    <div style="text-align:right"><div style="font-weight:900;letter-spacing:2px">VS3s</div><div style="font-size:8px;color:#C9A86A;letter-spacing:1px">REIGN IN GOODWILL</div></div>
    <div class="logo-circle">3</div>
  </div>
</div>

<div class="ticker">Maud True Born VS3s' King Will Always Reign in Goodwill • Encrypted Private Vault • 333 Collection • </div>

<div id="app" style="padding:20px;text-align:center;">
  <h2 style="color:#C9A86A">Vault Ready</h2>
  <p>Origin, Citizenship & Destination flags loaded</p>
</div>

<script>
// Set flags - change codes to your real ones: za, us, gb, etc
// Uses flagcdn.com
function setFlags(origin, citizen, dest){
  document.getElementById('flag-origin').src=`https://flagcdn.com/w80/${origin}.png`;
  document.getElementById('flag-citizen').src=`https://flagcdn.com/w80/${citizen}.png`;
  document.getElementById('flag-dest').src=`https://flagcdn.com/w80/${dest}.png`;
}
setFlags('za','za','us');
// Example: za = South Africa, us = USA
</script>
</body>
</html>
